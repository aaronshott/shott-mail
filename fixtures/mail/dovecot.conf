protocols = imap lmtp
listen = *
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </run/test-secrets/mail.crt
ssl_key = </run/test-secrets/mail.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu
mail_location = maildir:/mail/%n
first_valid_uid = 5000
passdb {
 driver = passwd-file
 args = /etc/dovecot/test-users
}
userdb {
 driver = passwd-file
 args = /etc/dovecot/test-users
}
service imap-login {
 inet_listener imap {
  port = 0
 }
 inet_listener imaps {
  port = 1993
  ssl = yes
 }
}
service auth {
 unix_listener /var/spool/postfix/private/auth {
  mode = 0660
  user = postfix
  group = postfix
 }
}
service lmtp {
 unix_listener /var/spool/postfix/private/dovecot-lmtp {
  mode = 0600
  user = postfix
  group = postfix
 }
}
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = no
auth_debug = no
auth_debug_passwords = no
